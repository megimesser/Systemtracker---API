- name: Systemtracker auf dem Homelab einrichten
  hosts: homelab
  vars:
    project_dir: /home/maximilian/systemtracker/Systemtracker---API
    venv_python: "{{ project_dir }}/.venv/bin/python"
    log_file: /home/maximilian/systemtracker-retention.log

  tasks:
    - name: Retention-Job täglich um 03:00
      ansible.builtin.cron:
        name: "systemtracker retention"
        minute: "0"
        hour: "3"
        job: "cd {{ project_dir }}/Fast && PYTHONPATH=.. {{ venv_python }} retention.py >> {{ log_file }} 2>&1"